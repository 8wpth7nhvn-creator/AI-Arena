<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AI Arena — Learn by Fighting. Don't ask AI for the answer. Beat AI by understanding the answer." />
    <meta name="theme-color" content="#0b0d17" />
    <title>AI Arena — Learn by Fighting</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <header class="topbar" role="banner">
      <a class="brand" href="#/" aria-label="AI Arena home">
        <span class="brand-mark" aria-hidden="true">⚔</span>
        <span class="brand-name">AI ARENA</span>
      </a>
      <div class="topbar-right">
        <span id="mode-badge" class="mode-badge" hidden></span>
        <div id="player-chip" class="player-chip" hidden></div>
      </div>
    </header>
    <main id="app" tabindex="-1">
      <div class="boot" role="status">Loading the arena…</div>
    </main>
    <div id="overlay-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <div id="sr-announcer" class="sr-only" aria-live="assertive"></div>
    <noscript><p class="noscript">AI Arena needs JavaScript to run.</p></noscript>
  </body>
</html>
